<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="For You">
<meta name="theme-color" content="#121212">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="album.js"></script>
<style>
  :root {
    --bg: #121212;
    --card: #1f1f1f;
    --ink: #ffffff;
    --muted: #b3b3b3;
    --green: #1ed760;
    --tint: #5a3a3a;       /* replaced at runtime with the cover's colour */
    --tint-dark: #3a2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  html { min-height: 100%; }
  body { min-height: 100vh; min-height: 100dvh; }
  body {
    font-family: "Figtree", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    font-size: 16px; line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; }
  .ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ico.fill { fill: currentColor; stroke: none; }
  .app { max-width: 480px; margin: 0 auto; position: relative; }

  /* ── Sticky title bar that fades in on scroll ── */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    display: flex; align-items: center; gap: 12px;
    background: var(--tint-dark);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .topbar.show { opacity: 1; pointer-events: auto; }
  .topbar b { font-weight: 700; font-size: 16px; flex: 1; text-align: center; margin-right: 36px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Album page ── */
  .album-head {
    background: linear-gradient(180deg, var(--tint) 0%, var(--bg) 100%);
    padding: calc(env(safe-area-inset-top) + 56px) 16px 0;
  }
  .album-cover {
    width: min(64vw, 280px); aspect-ratio: 1; margin: 0 auto 22px; display: block;
    box-shadow: 0 8px 40px rgba(0,0,0,.55); object-fit: cover;
  }
  .album-title { font-size: 24px; font-weight: 800; letter-spacing: -.2px; margin: 0 0 10px; }
  .artist-row { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
  .avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .actions { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 6px; }
  .actions .left, .actions .right { display: flex; align-items: center; gap: 22px; }
  .actions .left button { color: var(--muted); }
  .actions .ok { color: var(--green) !important; }
  .shuffle-btn { color: var(--muted); position: relative; }
  .shuffle-btn.on, .repeat-btn.on { color: var(--green); }
  .shuffle-btn.on::after, .repeat-btn.on::after {
    content: ""; position: absolute; left: 50%; bottom: -7px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--green);
  }
  .big-play {
    width: 56px; height: 56px; border-radius: 50%; background: var(--green); color: #000;
    display: grid; place-items: center; transition: transform .1s;
  }
  .big-play:active, .np-play:active, .mini-play:active { transform: scale(.94); }
  .big-play .ico { width: 26px; height: 26px; }

  .tracks { list-style: none; margin: 0; padding: 0 16px; }
  .track { display: flex; align-items: center; gap: 12px; padding: 9px 0; cursor: pointer; }
  .track .info { flex: 1; min-width: 0; }
  .track .t { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
  .track .a { color: var(--muted); font-size: 13.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .more { color: var(--muted); padding: 6px 0 6px 6px; }
  .track.active .t { color: var(--green); }
  .eq { display: none; gap: 2px; height: 12px; align-items: flex-end; flex: none; }
  .eq i { width: 3px; background: var(--green); animation: eq .9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.3s } .eq i:nth-child(3) { animation-delay: -.6s }
  @keyframes eq { 0%,100% { height: 3px } 50% { height: 12px } }
  .track.active.playing .eq { display: flex; }

  .album-foot { padding: 22px 16px calc(120px + env(safe-area-inset-bottom)); color: var(--muted); font-size: 13px; }
  .album-foot .date { color: var(--ink); font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .album-foot .ded { margin-top: 18px; line-height: 1.5; font-size: 14px; color: var(--ink); opacity: .85; }

  /* ── Mini player: cover bottom-left, play bottom-right ── */
  .mini {
    position: fixed; left: 8px; right: 8px; z-index: 6;
    bottom: calc(8px + env(safe-area-inset-bottom));
    max-width: 464px; margin: 0 auto;
    background: var(--tint-dark); border-radius: 8px; overflow: hidden;
    display: flex; align-items: center; gap: 10px; padding: 8px 10px 10px 8px;
    /* hidden: pushed fully below the screen, including the home-bar area */
    transform: translateY(calc(100% + 24px + env(safe-area-inset-bottom)));
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s, visibility 0s .3s, background .4s;
    cursor: pointer;
  }
  .mini.show { transform: none; opacity: 1; visibility: visible; pointer-events: auto; transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .2s, background .4s; }
  .mini img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; flex: none; }
  .mini .info { flex: 1; min-width: 0; }
  .mini .t { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .a { font-size: 13px; color: rgba(255,255,255,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-play { width: 40px; height: 40px; display: grid; place-items: center; flex: none; }
  .mini-play .ico { width: 26px; height: 26px; }
  .mini .bar { position: absolute; left: 10px; right: 10px; bottom: 3px; height: 2px; border-radius: 1px; background: rgba(255,255,255,.25); }
  .mini .bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 1px; }

  /* ── Full "Now Playing" screen ── */
  .np {
    position: fixed; inset: 0; z-index: 10; overflow-y: auto;
    background: linear-gradient(180deg, var(--tint) 0%, var(--tint-dark) 55%, #121212 100%);
    transform: translateY(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1);
    padding: calc(env(safe-area-inset-top) + 8px) 24px calc(env(safe-area-inset-bottom) + 24px);
  }
  .np.open { transform: none; }
  .np-inner { max-width: 440px; margin: 0 auto; }
  .np-top { display: flex; align-items: center; justify-content: space-between; height: 48px; }
  .np-top .from { text-align: center; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,.75); }
  .np-top .from b { display: block; font-size: 13px; letter-spacing: 0; text-transform: none; color: #fff; margin-top: 2px; }
  .np-cover { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; margin: 28px 0 32px; box-shadow: 0 16px 50px rgba(0,0,0,.45); display: block; }
  .np-title-row { display: flex; align-items: center; gap: 16px; }
  .np-title-row .info { flex: 1; min-width: 0; }
  .np-title { font-size: 22px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-artist { font-size: 16px; color: rgba(255,255,255,.7); margin-top: 2px; }
  .heart { color: rgba(255,255,255,.75); }
  .heart.on { color: var(--green); }
  .heart.on .ico { fill: currentColor; }

  .scrub { margin-top: 18px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(#fff, #fff) 0 / var(--p, 0%) 100% no-repeat, rgba(255,255,255,.3);
  }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; margin-top: -4px; }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,.7); font-variant-numeric: tabular-nums; margin-top: 2px; }

  .np-controls { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .np-controls .skip .ico { width: 34px; height: 34px; }
  .np-controls .shuffle-btn, .np-controls .repeat-btn { color: rgba(255,255,255,.8); position: relative; }
  .np-controls .shuffle-btn.on, .np-controls .repeat-btn.on { color: var(--green); }
  .repeat-btn .one { position: absolute; top: -4px; right: -6px; font-size: 9px; font-weight: 800; display: none; }
  .repeat-btn.one-on .one { display: block; }
  .np-play { width: 64px; height: 64px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; }
  .np-play .ico { width: 30px; height: 30px; }

  .card { background: rgba(0,0,0,.25); border-radius: 10px; padding: 16px; margin-top: 28px; }
  .card.lyrics { background: var(--tint); }
  .card h3 { margin: 0 0 12px; font-size: 16px; font-weight: 700; }
  .card p { margin: 0; white-space: pre-line; font-size: 20px; font-weight: 700; line-height: 1.45; }
  .card.about p { font-size: 15px; font-weight: 500; color: rgba(255,255,255,.85); }

  /* ── Header buttons (settings / library) ── */
  .album-head { position: relative; }
  .head-btn {
    position: absolute; top: calc(env(safe-area-inset-top) + 10px);
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(0,0,0,.28); color: #fff;
  }
  .head-btn.l { left: 12px; } .head-btn.r { right: 12px; }
  .head-btn .ico { width: 20px; height: 20px; }
  .topbar .head-btn { position: static; background: none; }
  .topbar b { margin-right: 0; }

  /* ── Views ── */
  .view { min-height: 100vh; min-height: 100dvh; }
  .view[hidden] { display: none; }
  .view.enter { animation: viewIn .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes viewIn { from { opacity: 0; transform: translateX(28px) } }

  /* ── Library (landing page) ── */
  .lib-head {
    position: sticky; top: 0; z-index: 4; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
    display: flex; align-items: center; gap: 12px;
  }
  .lib-head h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.3px; }
  .pfp {
    width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: #f573a0; color: #121212; font-weight: 800; font-size: 15px;
  }
  .chips { display: flex; gap: 8px; padding: 6px 16px 14px; }
  .chip { height: 32px; padding: 0 14px; border-radius: 16px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; background: #2a2a2a; }
  .chip.on { background: var(--green); color: #000; }
  .sort { display: flex; align-items: center; gap: 6px; padding: 0 16px 10px; font-size: 13px; font-weight: 600; }
  .sort .ico { width: 16px; height: 16px; }
  .lib-list { list-style: none; margin: 0; padding: 0 16px calc(120px + env(safe-area-inset-bottom)); }
  .lib-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; cursor: pointer; }
  .lib-item:active { opacity: .7; }
  .lib-item img { width: 67px; height: 67px; object-fit: cover; flex: none; }
  .lib-item .t { font-size: 16px; font-weight: 600; }
  .lib-item.playing .t { color: var(--green); }
  .lib-item .a { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; margin-top: 4px; }
  .lib-item .pin { width: 13px; height: 13px; color: var(--green); }

  /* ── Song rows: swipe right to queue ── */
  .track { position: relative; overflow: hidden; touch-action: pan-y; padding: 0; margin: 0 -16px; }
  .track-inner { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 9px 16px; background: var(--bg); position: relative; z-index: 1; transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .swipe-bg {
    position: absolute; inset: 0; background: var(--green); color: #000; display: flex; align-items: center; padding-left: 22px;
    opacity: 0; transition: opacity .25s;
  }
  .swipe-bg .ico { transition: transform .15s; }
  .swipe-bg.armed .ico { transform: scale(1.25); }

  /* ── Bottom fade behind the mini player, down to the screen edge ── */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; pointer-events: none;
    height: calc(env(safe-area-inset-bottom) + 96px);
    background: linear-gradient(to bottom, rgba(18,18,18,0) 0%, rgba(18,18,18,.92) 45%, #121212 100%);
    opacity: 0; transition: opacity .3s;
  }
  .dock.show { opacity: 1; }
  .mini { touch-action: pan-y; }
  .mini-track { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }

  /* ── Shared dimmed backdrop ── */
  .scrim { position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .scrim.show { opacity: 1; pointer-events: auto; }

  /* ── Song options sheet ── */
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 16; max-width: 480px; margin: 0 auto;
    background: #282828; border-radius: 14px 14px 0 0; padding: 8px 0 calc(env(safe-area-inset-bottom) + 18px);
    transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.open { transform: none; }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: #5a5a5a; margin: 0 auto 10px; }
  .sheet-head { display: flex; align-items: center; gap: 12px; padding: 6px 16px 14px; border-bottom: 1px solid #3a3a3a; margin-bottom: 6px; }
  .sheet-head img { width: 48px; height: 48px; object-fit: cover; }
  .sheet-head .t { font-weight: 700; } .sheet-head .a { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .s-item { display: flex; align-items: center; gap: 16px; width: 100%; padding: 14px 16px; font-size: 16px; font-weight: 500; text-align: left; }
  .s-item:active { background: #333; }
  .s-item .ico { color: var(--muted); }
  .s-item.on .ico { color: var(--green); fill: currentColor; }

  /* ── Settings drawer (slides in from the left) ── */
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 16; width: min(84vw, 360px);
    background: #1f1f1f; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 18px) 0 calc(env(safe-area-inset-bottom) + 18px);
    transform: translateX(-102%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .drawer.open { transform: none; }
  .drawer-profile { display: flex; align-items: center; gap: 14px; padding: 4px 18px 20px; border-bottom: 1px solid #333; }
  .pfp.big { width: 54px; height: 54px; font-size: 24px; }
  .pname { font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
  .psub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .d-label { padding: 18px 18px 6px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .d-item { display: flex; align-items: center; gap: 16px; width: 100%; padding: 13px 18px; text-align: left; font-size: 16px; font-weight: 600; }
  button.d-item:active { background: #2a2a2a; }
  .d-item small { display: block; color: var(--muted); font-size: 13px; font-weight: 500; margin-top: 2px; }
  .drawer-foot { margin-top: auto; padding: 0 18px; color: #7a7a7a; font-size: 12px; }

  /* ── Toast ── */
  .toast {
    position: fixed; left: 50%; z-index: 20; bottom: calc(env(safe-area-inset-bottom) + 84px);
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: all .25s;
    background: #fff; color: #000; font-weight: 700; font-size: 14px; padding: 11px 18px; border-radius: 8px; white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ── Queue card in Now Playing ── */
  .card.queue h3 { display: flex; justify-content: space-between; align-items: center; }
  .card.queue h3 button { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.7); }
  .q-list { list-style: none; margin: 0; padding: 0; }
  .q-list li { display: flex; align-items: center; gap: 12px; padding: 6px 0; font-weight: 600; }
  .q-list img { width: 40px; height: 40px; object-fit: cover; }
  .q-list small { display: block; color: rgba(255,255,255,.65); font-weight: 500; font-size: 13px; }
  .np { overscroll-behavior: contain; }

  /* ═════════════ ONBOARDING ═════════════ */
  .onboard { position: fixed; inset: 0; z-index: 30; background: #121212; overflow: hidden; transition: opacity .6s; }
  .onboard.leaving { opacity: 0; pointer-events: none; }
  .onboard[hidden], .story[hidden], .gift-stage[hidden] { display: none; }

  /* Gift + password */
  .gift-stage {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 20px);
    background: radial-gradient(120% 70% at 50% 40%, #3b1530 0%, #121212 65%);
    transition: opacity .5s;
  }
  .gift-stage.gone { opacity: 0; }
  .g-kicker { color: var(--green); font-weight: 700; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; text-align: center; }
  .gift-stage h1 { font-size: 28px; font-weight: 800; letter-spacing: -.5px; text-align: center; margin: 8px 0 36px; max-width: 14em; line-height: 1.15; }

  .gift { position: relative; width: min(66vw, 280px); aspect-ratio: 1; perspective: 1400px; animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1deg) } 50% { transform: translateY(-8px) rotate(1deg) } }
  .gift.shake { animation: shake .45s; }
  @keyframes shake { 0%,100% { transform: none } 20% { transform: translateX(-12px) rotate(-3deg) } 40% { transform: translateX(10px) rotate(3deg) } 60% { transform: translateX(-7px) } 80% { transform: translateX(5px) } }
  .gift-cover {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 4px;
    transform: scale(.94); transition: transform 1.2s cubic-bezier(.2,.8,.2,1) .5s, box-shadow 1.2s .5s;
  }
  .flap {
    position: absolute; top: 0; bottom: 0; width: 50%;
    background:
      radial-gradient(circle at 25% 25%, rgba(255,255,255,.85) 0 7%, transparent 7.5%) 0 0 / 34px 34px,
      radial-gradient(circle at 75% 75%, #ffc4dc 0 7%, transparent 7.5%) 0 0 / 34px 34px,
      linear-gradient(135deg, #e0306f, #f2709d);
    box-shadow: inset 0 0 30px rgba(0,0,0,.18);
    transition: transform 1.1s cubic-bezier(.5,0,.2,1) .35s, opacity .4s 1.1s;
    backface-visibility: hidden;
  }
  .flap.l { left: 0; transform-origin: left center; border-radius: 4px 0 0 4px; }
  .flap.r { right: 0; transform-origin: right center; border-radius: 0 4px 4px 0; }
  .ribbon { position: absolute; background: linear-gradient(90deg, #e9b949, #ffe08a 35%, #fff4cc 50%, #ffe08a 65%, #e9b949); transition: transform .6s cubic-bezier(.5,0,.5,1), opacity .4s .2s; }
  .ribbon.v { top: 0; bottom: 0; left: 50%; width: 13%; margin-left: -6.5%; }
  .ribbon.h { left: 0; right: 0; top: 50%; height: 13%; margin-top: -6.5%; background: linear-gradient(180deg, #e9b949, #ffe08a 35%, #fff4cc 50%, #ffe08a 65%, #e9b949); }
  .bow { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transition: transform .7s cubic-bezier(.4,0,.6,1), opacity .5s .15s; }
  .bow i {
    position: absolute; width: 64px; height: 40px; top: -20px; border-radius: 50%;
    border: 13px solid #ffd76a; box-shadow: 0 4px 10px rgba(0,0,0,.25);
  }
  .bow i:first-child { right: 4px; transform: rotate(-25deg); }
  .bow i:last-child { left: 4px; transform: rotate(25deg); }
  .bow b { position: absolute; width: 26px; height: 26px; left: -13px; top: -13px; border-radius: 8px; background: #f5c445; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .tag {
    position: absolute; right: -14px; bottom: -18px; background: #fffaf0; color: #3b1530;
    font-weight: 700; font-size: 13px; padding: 6px 12px 6px 18px; border-radius: 4px 10px 10px 4px;
    transform: rotate(-8deg); box-shadow: 0 6px 16px rgba(0,0,0,.35);
    transition: transform .8s cubic-bezier(.5,0,.7,.4), opacity .6s .2s;
  }
  .tag::before { content: ""; position: absolute; left: 7px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: #3b1530; }

  .gift.open { animation: none; }
  .gift.open .bow { transform: translateY(-260px) scale(1.4) rotate(40deg); opacity: 0; }
  .gift.open .ribbon.v { transform: translateY(-110%); opacity: 0; }
  .gift.open .ribbon.h { transform: translateX(110%); opacity: 0; }
  .gift.open .flap.l { transform: rotateY(-120deg); opacity: 0; }
  .gift.open .flap.r { transform: rotateY(120deg); opacity: 0; }
  .gift.open .tag { transform: translateY(300px) rotate(50deg); opacity: 0; }
  .gift.open .gift-cover { transform: scale(1.06); box-shadow: 0 0 80px rgba(240, 55, 165, .55), 0 20px 50px rgba(0,0,0,.5); }

  .unlock { display: flex; gap: 8px; width: min(100%, 320px); margin-top: 48px; transition: opacity .4s; }
  .unlock.gone, .hint-btn.gone, .hint.gone { opacity: 0; pointer-events: none; }
  .unlock input {
    flex: 1; min-width: 0; height: 48px; border-radius: 24px; border: 0; padding: 0 20px;
    background: #2a2a2a; color: #fff; font: 600 16px "Figtree", -apple-system, sans-serif; outline: none;
    -webkit-text-security: disc; letter-spacing: 1px;
  }
  .unlock input::placeholder { color: #8a8a8a; letter-spacing: 0; }
  .unlock input:focus { box-shadow: 0 0 0 2px #fff; }
  .unlock.shake { animation: shake .45s; }
  .unwrap-btn { height: 48px; padding: 0 22px; border-radius: 24px; background: var(--green); color: #000; font-weight: 800; }
  .hint-btn { margin-top: 18px; color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .hint { margin: 10px 0 0; min-height: 22px; font-size: 15px; font-weight: 600; color: #ff8fc1; text-align: center; }

  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
  .confetti i { position: absolute; left: 50%; top: 45%; width: 9px; height: 14px; border-radius: 2px; }

  /* Wrapped-style stories */
  .story { position: absolute; inset: 0; }
  .sbars { position: absolute; z-index: 4; left: 10px; right: 10px; top: calc(env(safe-area-inset-top) + 10px); display: flex; gap: 4px; }
  .sbars span { flex: 1; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--fg, #fff) 35%, transparent); overflow: hidden; }
  .sbars span i { display: block; height: 100%; width: 0; background: var(--fg, #fff); }
  .sbars span.done i { width: 100%; }
  .sbars span.now i { animation: fill var(--dur, 6s) linear forwards; }
  .story.paused .sbars span.now i { animation-play-state: paused; }
  @keyframes fill { to { width: 100% } }
  .story-skip { position: absolute; z-index: 5; right: 14px; top: calc(env(safe-area-inset-top) + 24px); font-weight: 700; font-size: 14px; color: var(--fg, #fff); opacity: .8; }
  .tap { position: absolute; z-index: 2; top: 0; bottom: 0; }
  .tap.prev { left: 0; width: 30%; } .tap.next { right: 0; width: 70%; }

  .slide {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 60px) 28px calc(env(safe-area-inset-bottom) + 50px);
    background: var(--bg-s); color: var(--fg); overflow: hidden;
    visibility: hidden;
  }
  .slide.active { visibility: visible; }
  .slide > * { position: relative; z-index: 1; }
  .slide .kicker { font-size: 22px; font-weight: 700; letter-spacing: -.2px; }
  .slide .big { font-size: clamp(54px, 17vw, 96px); font-weight: 800; letter-spacing: -2.5px; line-height: .95; margin: 14px 0 18px; overflow-wrap: anywhere; }
  .slide .small { font-size: 21px; font-weight: 600; line-height: 1.3; max-width: 16em; opacity: .9; }
  .slide.active .kicker { animation: rise .6s cubic-bezier(.2,.8,.2,1) .15s both; }
  .slide.active .big { animation: pop .8s cubic-bezier(.2,1.3,.4,1) .45s both; }
  .slide.active .small, .slide.active .final-btn, .slide.active .by { animation: rise .6s cubic-bezier(.2,.8,.2,1) 1s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) } }
  @keyframes pop { from { opacity: 0; transform: scale(.6) rotate(-4deg) } }

  /* colour themes */
  .c-purple { --bg-s: #4100f5; --fg: #cdf564; --acc: #f037a5; }
  .c-lime   { --bg-s: #cdf564; --fg: #121212; --acc: #4100f5; }
  .c-pink   { --bg-s: #f037a5; --fg: #ffffff; --acc: #ffcd1e; }
  .c-orange { --bg-s: #ff6437; --fg: #121212; --acc: #fffbeb; }
  .c-blue   { --bg-s: #1e3264; --fg: #ffffff; --acc: #1ed760; }
  .c-red    { --bg-s: #e91429; --fg: #ffffff; --acc: #ffcd1e; }
  .c-green  { --bg-s: #1ed760; --fg: #121212; --acc: #4100f5; }

  /* moving background shapes */
  .deco { position: absolute; inset: 0; z-index: 0 !important; pointer-events: none; }
  .deco i { position: absolute; display: block; }
  .d0 i:nth-child(1) { width: 120vw; height: 120vw; right: -60vw; top: -40vw; border-radius: 50%; border: 28px solid var(--acc); opacity: .9; animation: spin 18s linear infinite; }
  .d0 i:nth-child(2) { width: 34vw; height: 34vw; left: -8vw; bottom: 8vh; border-radius: 50%; background: var(--acc); animation: float 4s ease-in-out infinite; }
  .d1 i:nth-child(1) { left: -20%; right: -20%; top: 12%; height: 70px; background: repeating-linear-gradient(90deg, var(--acc) 0 22px, transparent 22px 40px); transform: rotate(-12deg); animation: slide 6s linear infinite; }
  .d1 i:nth-child(2) { width: 50vw; height: 50vw; right: -14vw; bottom: -10vw; border-radius: 50% 50% 0 50%; background: var(--acc); animation: spin 14s linear infinite; }
  .d2 i:nth-child(1) { width: 70vw; height: 70vw; left: -25vw; top: -20vw; background: var(--acc); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: spin 22s linear infinite; }
  .d2 i:nth-child(2) { width: 26vw; height: 26vw; right: 8vw; bottom: 10vh; border-radius: 50%; border: 18px solid var(--acc); animation: float 3.4s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  @keyframes float { 0%,100% { translate: 0 0 } 50% { translate: 0 -24px } }
  @keyframes slide { to { background-position: 40px 0 } }

  /* memory slides with a photo */
  .slide.has-photo { justify-content: flex-end; }
  .slide .photo {
    position: relative; align-self: center; width: min(76vw, 330px); height: min(46vh, 412px); margin-bottom: 26px;
    border-radius: 6px; overflow: visible; transform: rotate(var(--tilt, -3deg));
  }
  .slide .photo .frame { position: absolute; inset: 0; border-radius: 6px; overflow: hidden; box-shadow: 0 18px 44px rgba(0,0,0,.35); background: rgba(0,0,0,.15); }
  .slide .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide.active .photo { animation: photoIn .9s cubic-bezier(.2,1.2,.35,1) .1s both; }
  .slide.active .photo img { animation: kenburns 7s ease-out both; }
  @keyframes photoIn { from { opacity: 0; transform: translateY(40px) scale(.8) rotate(8deg) } }
  @keyframes kenburns { from { transform: scale(1.15) } to { transform: scale(1) } }
  .slide .sticker {
    position: absolute; z-index: 2; right: -12px; top: -12px; padding: 8px 14px; border-radius: 999px;
    background: var(--acc); color: var(--bg-s); font-weight: 800; font-size: 15px; transform: rotate(8deg);
    box-shadow: 0 6px 16px rgba(0,0,0,.25);
  }
  .slide.active .sticker { animation: pop .6s cubic-bezier(.2,1.5,.4,1) .9s both; }
  .slide.has-photo .deco i:nth-child(2) { display: none; }   /* keep the text area clear */
  .slide.has-photo .big { font-size: clamp(40px, 12vw, 64px); letter-spacing: -1.5px; margin: 8px 0 10px; }
  .slide.has-photo .kicker { font-size: 19px; }
  .slide.has-photo .small { font-size: 18px; }
  .slide.final { align-items: center; text-align: center; }
  .slide .final-cover { width: min(64vw, 280px); aspect-ratio: 1; object-fit: cover; margin: 22px 0 20px; box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  .slide.active .final-cover { animation: spinIn 1.1s cubic-bezier(.2,1.1,.3,1) .4s both; }
  @keyframes spinIn { from { opacity: 0; transform: scale(.3) rotate(-30deg) } }
  .slide .final-title { font-size: 34px; font-weight: 800; letter-spacing: -.8px; }
  .slide .by { font-size: 17px; font-weight: 600; opacity: .85; margin-top: 4px; }
  .final-btn { position: relative; z-index: 6 !important; margin-top: 28px; height: 52px; padding: 0 30px; border-radius: 26px; background: #fff; color: #000; font-weight: 800; font-size: 16px; }
</style>
</head>

    <button class="head-btn r lib-btn" aria-label="Your Library"><svg class="ico" viewBox="0 0 24 24"><path d="M4 3.5v17M9.5 3.5v17M14.5 4l5.5 16.5"/></svg></button>

        </button>

  <div class="bar"><i id="miniBar"></i></div>
</div>

<!-- Now Playing -->
<section class="np" id="np" aria-hidden="true">

    <div class="np-top">
      <button id="npClose" aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="from">Playing from album<b id="npAlbum"></b></div>
      <button aria-label="More"><svg class="ico fill" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    </div>
    <img class="np-cover" id="npCover" alt="">

      <button class="np-play" id="npPlay" aria-label="Play"><svg class="ico fill" viewBox="0 0 24 24"><path class="pp" d="M8 5v14l11-7z"/></svg></button>
      <button class="skip" id="next" aria-label="Next"><svg class="ico fill" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>

<!-- Song options (the ⋯ button) -->

  <button class="s-item" id="sLike"><svg class="ico" viewBox="0 0 24 24"><path d="M12 20.5l-1.3-1.2C5.6 14.7 2.5 11.9 2.5 8.4 2.5 5.6 4.7 3.5 7.4 3.5c1.6 0 3.3.8 4.6 2.2 1.3-1.4 3-2.2 4.6-2.2 2.7 0 4.9 2.1 4.9 4.9 0 3.5-3.1 6.3-8.2 10.9z"/></svg><span id="sLikeText">Like</span></button>

    <div><div class="pname" id="pname"></div><div class="psub" id="psub"></div></div>

  <button class="d-item" id="replayGift"><svg class="ico" viewBox="0 0 24 24"><path d="M4 11h16v9H4zM3 7h18v4H3zM12 7v13M12 7C10.5 4 7 3.5 7 5.8 7 7 9.5 7 12 7zM12 7c1.5-3 5-3.5 5-1.2C17 7 14.5 7 12 7z"/></svg><span>Replay the gift<small>Unwrap it all over again</small></span></button>
  <div class="d-item"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v8M8.5 12l3.5 3.5 3.5-3.5"/></svg><span>Downloaded<small id="dlStatus">Checking…</small></span></div>
  <div class="d-item"><svg class="ico" viewBox="0 0 24 24"><path d="M12 20.5l-1.3-1.2C5.6 14.7 2.5 11.9 2.5 8.4 2.5 5.6 4.7 3.5 7.4 3.5c1.6 0 3.3.8 4.6 2.2 1.3-1.4 3-2.2 4.6-2.2 2.7 0 4.9 2.1 4.9 4.9 0 3.5-3.1 6.3-8.2 10.9z"/></svg><span>Liked songs<small id="likedCount"></small></span></div>

<!-- Welcome: wrapped gift → password → Wrapped stories -->
<div class="onboard" id="onboard" hidden>
  <section class="gift-stage" id="giftStage">
    <div class="g-kicker" id="gKicker"></div>
    <h1 id="gHeading"></h1>
    <div class="gift" id="gift">
      <img class="gift-cover" id="giftCover" alt="">
      <div class="flap l"></div><div class="flap r"></div>

      <input id="pw" type="text" placeholder="Password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Password">
      <button type="submit" class="unwrap-btn">Unwrap</button>
    </form>
    <button class="hint-btn" id="hintBtn" type="button">Need a hint?</button>
    <p class="hint" id="hint" aria-live="polite"></p>
  </section>
  <section class="story" id="story" hidden>
    <div class="sbars" id="sbars"></div>
    <button class="story-skip" id="storySkip">Skip</button>
    <div id="slides"></div>
    <div class="tap prev" id="tapPrev"></div><div class="tap next" id="tapNext"></div>
  </section>
</div>
<div class="confetti" id="confetti"></div>

<!-- One shared <audio> element: this is what lets iOS keep playing
     on the lock screen and move to the next song while locked. -->
<audio id="audio" preload="metadata" playsinline></audio>

<script>
  const A = self.ALBUM;
  const $ = (id) => document.getElementById(id);
  const $$ = (sel) => [...document.querySelectorAll(sel)];
  const audio = $("audio");
  const PLAY = "M8 5v14l11-7z";
  const PAUSE = "M6 5h4v14H6zM14 5h4v14h-4z";
  const N = A.tracks.length;
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  let current = -1;          // index into A.tracks
  let order = [...Array(N).keys()];
  let pos = 0;               // position within `order`
  let shuffle = store.get("shuffle", false);
  let repeat = 0;            // 0 off, 1 all, 2 one
  let liked = store.get("liked", {});
  let queue = [];            // songs added with "Add to queue", played before the rest
  let history = [];          // what played before, so "previous" can step back
  let curPos = 0;            // `pos` as it was when the current song started
  let view = "library";

  const fmt = (s) => !isFinite(s) ? "0:00" : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  // Horizontal swipe on an element, leaving vertical scrolling alone
  function swipeable(el, { move, end }) {
    let x0 = 0, y0 = 0, dx = 0, state = 0;   // 0 idle · 1 deciding · 2 swiping · 3 scrolling
    el.addEventListener("pointerdown", (e) => { x0 = e.clientX; y0 = e.clientY; dx = 0; state = 1; });
    el.addEventListener("pointermove", (e) => {
      if (state === 1) {
        const ax = Math.abs(e.clientX - x0), ay = Math.abs(e.clientY - y0);
        if (ay > 10 && ay > ax) state = 3;
        else if (ax > 10) { state = 2; try { el.setPointerCapture(e.pointerId); } catch (_) {} }
      }
      if (state === 2) { dx = e.clientX - x0; move(dx); }
    });
    el.addEventListener("pointerup", () => {
      if (state === 2) { el._swiped = true; setTimeout(() => (el._swiped = false), 60); end(dx); }
      state = 0;
    });
    el.addEventListener("pointercancel", () => { if (state === 2) end(0); state = 0; });
  }

  // ── Album page ──
  document.title = A.title;
  [$("cover"), $("avatar"), $("miniCover"), $("npCover")].forEach((el) => (el.src = A.cover));
  $("title").textContent = $("topTitle").textContent = $("npAlbum").textContent = A.title;
  $("artist").textContent = A.artist;
  $("meta").textContent = `Album · ${A.year}`;

  A.tracks.forEach((t, i) => {
    const li = document.createElement("li");
    li.className = "track";
    li.innerHTML = `<div class="swipe-bg"><svg class="ico" viewBox="0 0 24 24"><path d="M3 6h13M3 11h13M3 16h8M18 13v8M14 17h8"/></svg></div>
      <div class="track-inner">
        <div class="info"><div class="t"><span class="eq"><i></i><i></i><i></i></span><span class="name"></span></div><div class="a"></div></div>
        <button class="more" aria-label="More options for ${t.title.replace(/"/g, "")}"><svg class="ico fill" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>
      </div>`;
    li.querySelector(".name").textContent = t.title;
    li.querySelector(".a").textContent = A.artist;
    li.onclick = () => { if (!li._swiped) i === current ? toggle() : start(i); };
    li.querySelector(".more").onclick = (e) => { e.stopPropagation(); openSheet(i); };

    // Swipe right to add to queue
    const inner = li.querySelector(".track-inner"), bg = li.querySelector(".swipe-bg");
    swipeable(li, {
      move(dx) {
        const d = Math.max(0, Math.min(dx, 140));
        inner.style.transition = bg.style.transition = "none";
        inner.style.transform = `translateX(${d}px)`;
        bg.style.opacity = Math.min(1, d / 40);
        bg.classList.toggle("armed", d > 72);
      },
      end(dx) {
        inner.style.transition = bg.style.transition = "";
        inner.style.transform = ""; bg.style.opacity = ""; bg.classList.remove("armed");
        if (dx > 72) addToQueue(i);
      },
    });
    $("list").appendChild(li);
  });
  const rows = [...$("list").children];

  // Total length for the footer, like "3 songs, 1 min 15 sec"
  let total = 0, loaded = 0;
  const renderFoot = () => {
    const m = Math.floor(total / 60), s = Math.round(total % 60);
    $("foot").innerHTML = `<div class="date"></div><div class="len"></div><div class="ded"></div>`;
    $("foot").querySelector(".date").textContent = A.year;
    $("foot").querySelector(".len").textContent = `${N} song${N === 1 ? "" : "s"}` + (loaded === N ? `, ${m} min ${s} sec` : "");
    $("foot").querySelector(".ded").textContent = A.dedication || "";
  };
  renderFoot();
  A.tracks.forEach((t) => {
    const p = new Audio(); p.preload = "metadata"; p.src = t.file;
    p.onloadedmetadata = () => { total += p.duration; loaded++; renderFoot(); };
  });

  // Tint the page with the cover's main colour
  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement("canvas"); c.width = c.height = 24;
      const x = c.getContext("2d"); x.drawImage(img, 0, 0, 24, 24);
      const d = x.getImageData(0, 0, 24, 24).data;
      let r = 0, g = 0, b = 0, w = 0;
      for (let i = 0; i < d.length; i += 4) {
        const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]);
        const wt = 1 + (mx - mn);          // favour colourful pixels
        r += d[i] * wt; g += d[i + 1] * wt; b += d[i + 2] * wt; w += wt;
      }
      const [h, s] = rgbToHsl(r / w, g / w, b / w);
      document.documentElement.style.setProperty("--tint", `hsl(${h} ${Math.min(s, 55)}% 34%)`);
      document.documentElement.style.setProperty("--tint-dark", `hsl(${h} ${Math.min(s, 50)}% 22%)`);
    } catch (e) {}
  };
  img.src = A.cover;
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    if (mx === mn) return [0, 0, l * 100];
    const dd = mx - mn, s = l > .5 ? dd / (2 - mx - mn) : dd / (mx + mn);
    const h = mx === r ? (g - b) / dd + (g < b ? 6 : 0) : mx === g ? (b - r) / dd + 2 : (r - g) / dd + 4;
    return [Math.round(h * 60), Math.round(s * 100), l * 100];
  }

  // Title bar appears once the album title scrolls away
  addEventListener("scroll", () => $("topbar").classList.toggle("show", view === "album" && scrollY > $("title").offsetTop), { passive: true });

  // ── Queue / shuffle ──
  function buildOrder(first) {
    order = [...Array(N).keys()];
    if (shuffle) {
      for (let i = N - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
      if (first != null) { order.splice(order.indexOf(first), 1); order.unshift(first); }
    }
    pos = first == null ? 0 : order.indexOf(first);
  }
  function setShuffle(on) {
    shuffle = on; store.set("shuffle", on);
    $$(".shuffle-btn").forEach((b) => { b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    if (current >= 0) buildOrder(current);
  }
  $$(".shuffle-btn").forEach((b) => (b.onclick = (e) => { e.stopPropagation(); setShuffle(!shuffle); }));
  setShuffle(shuffle);

  $("repeat").onclick = () => {
    repeat = (repeat + 1) % 3;
    $("repeat").classList.toggle("on", repeat > 0);
    $("repeat").classList.toggle("one-on", repeat === 2);
  };

  // ── Playback ──
  function start(i) { buildOrder(i); load(i, true); }
  function load(i, autoplay, back) {
    if (!back && current >= 0 && i !== current) history.push({ i: current, pos: curPos });
    current = i;
    curPos = pos;
    const t = A.tracks[i];
    audio.src = t.file;
    $("miniTitle").textContent = $("npTitle").textContent = t.title;
    $("miniArtist").textContent = $("npArtist").textContent = A.artist;
    $("lyrics").textContent = t.lyrics || "";
    $("lyricsCard").hidden = !t.lyrics;
    $("about").textContent = t.note || "";
    $("aboutCard").hidden = !t.note;
    $("heart").classList.toggle("on", !!liked[t.file]);
    rows.forEach((r, j) => r.classList.toggle("active", j === i));
    $("mini").classList.add("show");
    $("dock").classList.add("show");
    setMeta(t);
    if (autoplay) audio.play().catch(() => {});
  }
  function toggle() {
    if (current < 0 && queue.length) return start(takeQueued());
    if (current < 0) return start(shuffle ? Math.floor(Math.random() * N) : 0);
    audio.paused ? audio.play() : audio.pause();
  }
  function next(auto) {
    if (current < 0) return toggle();
    if (queue.length) return load(takeQueued(), true);   // queued songs first
    if (pos < N - 1) { pos++; return load(order[pos], true); }
    if (repeat === 1 || !auto) { buildOrder(); return load(order[0], repeat === 1 || !auto); }
    buildOrder(); load(order[0], false);   // end of album: stop at the first song
  }
  // `force` skips the "restart if past 3 seconds" rule (used by the swipe)
  function prev(force) {
    if (current < 0) return toggle();
    if ((!force && audio.currentTime > 3) || !history.length) { audio.currentTime = 0; return; }
    const h = history.pop();
    pos = h.pos;
    load(h.i, true, true);
  }

  $("bigPlay").onclick = toggle;
  $("npPlay").onclick = toggle;
  $("miniPlay").onclick = (e) => { e.stopPropagation(); toggle(); };
  $("next").onclick = () => next(false);
  $("prev").onclick = () => prev();

  // ── Queue ──
  function takeQueued() { const i = queue.shift(); renderQueue(); return i; }
  function addToQueue(i) {
    queue.push(i);
    renderQueue();
    toast(`Added to queue`);
  }
  function renderQueue() {
    $("queueCard").hidden = !queue.length;
    $("queueList").innerHTML = "";
    queue.forEach((i) => {
      const li = document.createElement("li");
      li.innerHTML = `<img src="" alt=""><div><span></span><small></small></div>`;
      li.querySelector("img").src = A.cover;
      li.querySelector("span").textContent = A.tracks[i].title;
      li.querySelector("small").textContent = A.artist;
      $("queueList").appendChild(li);
    });
  }
  $("clearQueue").onclick = () => { queue = []; renderQueue(); };

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove("show"), 1800);
  }
  audio.addEventListener("ended", () => {
    if (repeat === 2) { audio.currentTime = 0; audio.play(); } else next(true);
  });

  function toggleLike(i) {
    const f = A.tracks[i].file;
    liked[f] = !liked[f]; store.set("liked", liked);
    if (i === current) $("heart").classList.toggle("on", liked[f]);
    renderLikedCount();
    toast(liked[f] ? "Added to Liked Songs" : "Removed from Liked Songs");
  }
  $("heart").onclick = () => toggleLike(current);
  function renderLikedCount() {
    const n = A.tracks.filter((t) => liked[t.file]).length;
    $("likedCount").textContent = `${n} song${n === 1 ? "" : "s"}`;
  }

  // Open / close the Now Playing screen
  const openNP = (open) => { $("np").classList.toggle("open", open); $("np").setAttribute("aria-hidden", !open); };
  $("mini").onclick = () => { if (!$("mini")._swiped) openNP(true); };
  const mt = $("miniTrack");
  swipeable($("mini"), {
    move(dx) {
      mt.style.transition = "none";
      mt.style.transform = `translateX(${dx}px)`;
      mt.style.opacity = 1 - Math.min(Math.abs(dx) / 220, .6);
    },
    end(dx) {
      if (Math.abs(dx) < 70) {
        mt.style.transition = "transform .25s, opacity .25s"; mt.style.transform = ""; mt.style.opacity = "";
        return;
      }
      const left = dx < 0;   // swipe left = next, right = previous
      mt.style.transition = "transform .16s ease-in, opacity .16s";
      mt.style.transform = `translateX(${left ? -110 : 110}%)`; mt.style.opacity = 0;
      setTimeout(() => {
        left ? next(false) : prev(true);
        mt.style.transition = "none";
        mt.style.transform = `translateX(${left ? 60 : -60}%)`;
        void mt.offsetWidth;
        mt.style.transition = "transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s";
        mt.style.transform = ""; mt.style.opacity = "";
      }, 160);
    },
  });
  $("npClose").onclick = () => openNP(false);
  let touchY = null;   // swipe down on the cover to close
  $("np").addEventListener("touchstart", (e) => { if ($("np").scrollTop <= 0) touchY = e.touches[0].clientY; }, { passive: true });
  $("np").addEventListener("touchend", (e) => { if (touchY != null && e.changedTouches[0].clientY - touchY > 90) openNP(false); touchY = null; }, { passive: true });

  function syncUI() {
    const playing = !audio.paused;
    $$(".pp").forEach((p) => p.setAttribute("d", playing ? PAUSE : PLAY));
    ["bigPlay", "npPlay", "miniPlay"].forEach((id) => $(id).setAttribute("aria-label", playing ? "Pause" : "Play"));
    rows.forEach((r) => r.classList.toggle("playing", playing));
    $("libAlbum").classList.toggle("playing", current >= 0);
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = playing ? "playing" : "paused";
  }
  audio.addEventListener("play", syncUI);
  audio.addEventListener("pause", syncUI);

  // ── Progress ──
  let dragging = false;
  const seek = $("seek");
  function showTime(t) {
    const d = audio.duration || 0, p = d ? t / d : 0;
    seek.style.setProperty("--p", p * 100 + "%");
    $("cur").textContent = fmt(t);
    $("left").textContent = "-" + fmt(Math.max(0, d - t));
    $("miniBar").style.width = p * 100 + "%";
  }
  audio.addEventListener("timeupdate", () => {
    if (dragging || !audio.duration) return;
    seek.value = (audio.currentTime / audio.duration) * 1000;
    showTime(audio.currentTime);
  });
  audio.addEventListener("loadedmetadata", () => showTime(0));
  seek.addEventListener("input", () => { dragging = true; showTime((seek.value / 1000) * (audio.duration || 0)); });
  seek.addEventListener("change", () => {
    if (audio.duration) audio.currentTime = (seek.value / 1000) * audio.duration;
    dragging = false;
  });

  // ── Lock screen / Control Center ──
  function setMeta(t) {
    if (!("mediaSession" in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title,
      artist: A.artist,
      album: A.title,
      artwork: [
        { src: new URL("icon-512.png", location.href).href, sizes: "512x512", type: "image/png" },
        { src: new URL(A.cover, location.href).href, sizes: "1024x1024", type: "image/jpeg" },
      ],
    });
  }
  function updatePosition() {
    if (!("mediaSession" in navigator) || !audio.duration) return;
    try {
      navigator.mediaSession.setPositionState({
        duration: audio.duration, position: Math.min(audio.currentTime, audio.duration), playbackRate: audio.playbackRate,
      });
    } catch (e) {}
  }
  if ("mediaSession" in navigator) {
    const ms = navigator.mediaSession;
    const on = (a, fn) => { try { ms.setActionHandler(a, fn); } catch (e) {} };
    on("play", () => audio.play());
    on("pause", () => audio.pause());
    on("previoustrack", prev);
    on("nexttrack", () => next(false));
    on("seekto", (d) => { audio.currentTime = d.seekTime; updatePosition(); });
    // Leaving these unset makes iOS show ⏮ ⏭ instead of ±10s buttons.
    on("seekbackward", null);
    on("seekforward", null);
    ["loadedmetadata", "play", "pause", "seeked", "ratechange"].forEach((ev) => audio.addEventListener(ev, updatePosition));
  }

  // ═════════════ ONBOARDING ═════════════
  const W = A.welcome || {};
  const fill = (str) => String(str || "")
    .replaceAll("{to}", W.to || "")
    .replaceAll("{artist}", A.artist)
    .replaceAll("{songs}", N)
    .replaceAll("{length}", total >= 120 ? `${Math.round(total / 60)} minutes` : `${Math.round(total)} seconds`);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let attempts = 0;

  $("giftCover").src = A.cover;
  $("gKicker").textContent = W.to ? `For ${W.to}` : "For you";
  $("tag").textContent = `To: ${W.to || "you"}`;

  function showOnboarding() {
    openNP(false);
    audio.pause();
    attempts = 0;
    $("gHeading").textContent = W.heading || "Something's waiting for you";
    $("gift").className = "gift";
    $("giftStage").hidden = false;
    $("giftStage").classList.remove("gone");
    ["unlock", "hintBtn", "hint"].forEach((id) => $(id).classList.remove("gone"));
    $("hint").textContent = "";
    $("pw").value = "";
    $("story").hidden = true;
    $("onboard").classList.remove("leaving");
    $("onboard").hidden = false;
    document.body.style.overflow = "hidden";
    if (!W.password) unwrap();   // no password set → just open it
  }

  $("hintBtn").onclick = () => ($("hint").textContent = `Psst… ${W.hint}`);

  $("unlock").addEventListener("submit", (e) => {
    e.preventDefault();
    const guess = $("pw").value.trim().toLowerCase();
    if (guess === String(W.password).toLowerCase()) return unwrap();
    attempts++;
    for (const id of ["gift", "unlock"]) {
      $(id).classList.remove("shake"); void $(id).offsetWidth; $(id).classList.add("shake");
    }
    $("hint").textContent = attempts >= 2 ? `Psst… ${W.hint}` : "Nope. Try again.";
    $("pw").select();
  });

  function unwrap() {
    $("pw").blur();
    ["unlock", "hintBtn", "hint"].forEach((id) => $(id).classList.add("gone"));
    $("gHeading").textContent = `It's all yours${W.to ? ", " + W.to : ""}.`;
    $("gift").classList.remove("shake");
    $("unlock").classList.remove("shake");
    $("gift").classList.add("open");
    setTimeout(confetti, 700);
    setTimeout(() => $("giftStage").classList.add("gone"), 2800);
    setTimeout(showStory, 3300);
  }

  function confetti() {
    const box = $("confetti");
    const colors = ["#1ed760", "#f037a5", "#cdf564", "#ffcd1e", "#4100f5", "#ff6437", "#ffffff"];
    for (let i = 0; i < 90; i++) {
      const c = document.createElement("i");
      c.style.background = colors[i % colors.length];
      box.appendChild(c);
      const ang = Math.random() * Math.PI * 2, dist = 140 + Math.random() * 260;
      const x = Math.cos(ang) * dist, y = Math.sin(ang) * dist - 120;
      c.animate([
        { transform: "translate(-50%,-50%) rotate(0) scale(.6)", opacity: 1 },
        { transform: `translate(${x}px, ${y}px) rotate(${Math.random() * 720}deg) scale(1)`, opacity: 1, offset: .45 },
        { transform: `translate(${x * 1.15}px, ${y + 520}px) rotate(${Math.random() * 1080}deg) scale(.9)`, opacity: 0 },
      ], { duration: 2200 + Math.random() * 1200, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => c.remove();
    }
  }

  // ── Wrapped stories ──
  const SLIDES = A.wrapped || [];
  let si = 0, heldAt = 0;

  function buildSlides() {
    $("slides").innerHTML = "";
    $("sbars").innerHTML = "";
    SLIDES.forEach((s, i) => {
      const el = document.createElement("div");
      el.className = `slide c-${s.color || "purple"}` + (s.type === "final" ? " final" : "");
      const deco = `<div class="deco d${i % 3}"><i></i><i></i></div>`;
      if (s.type === "final") {
        el.innerHTML = `${deco}<div class="kicker">${esc(fill(s.kicker))}</div>
          <img class="final-cover" src="${esc(A.cover)}" alt="">
          <div class="final-title">${esc(A.title)}</div><div class="by">${esc(A.artist)}</div>
          <button class="final-btn">${esc(fill(s.button || "Start listening"))}</button>`;
        el.querySelector(".final-btn").onclick = finishOnboarding;
      } else if (s.photo) {
        el.classList.add("has-photo");
        el.style.setProperty("--tilt", (i % 2 ? 3 : -3) + "deg");
        el.innerHTML = `${deco}<div class="photo"><div class="frame"><img src="${esc(s.photo)}" alt=""></div>
            ${s.date ? `<span class="sticker">${esc(fill(s.date))}</span>` : ""}</div>
          <div class="kicker">${esc(fill(s.kicker))}</div>
          <div class="big">${esc(fill(s.big))}</div><div class="small">${esc(fill(s.small))}</div>`;
      } else {
        el.innerHTML = `${deco}<div class="kicker">${esc(fill(s.kicker))}</div>
          <div class="big">${esc(fill(s.big))}</div><div class="small">${esc(fill(s.small))}</div>`;
      }
      $("slides").appendChild(el);
      const bar = document.createElement("span");
      bar.innerHTML = "<i></i>";
      bar.querySelector("i").addEventListener("animationend", () => { if (si === i && i < SLIDES.length - 1) go(i + 1); });
      $("sbars").appendChild(bar);
    });
  }

  function go(i) {
    si = Math.max(0, Math.min(i, SLIDES.length - 1));
    const slides = [...$("slides").children], bars = [...$("sbars").children];
    slides.forEach((s, j) => s.classList.toggle("active", j === si));
    bars.forEach((b, j) => {
      b.classList.toggle("done", j < si);
      b.classList.remove("now"); void b.offsetWidth;
      if (j === si) b.classList.add("now");
    });
    // Bars / Skip take the slide's text colour
    $("story").className = `story c-${SLIDES[si].color || "purple"}`;
    $("storySkip").style.visibility = si === SLIDES.length - 1 ? "hidden" : "visible";
  }

  function showStory() {
    if (!SLIDES.length) return finishOnboarding();
    buildSlides();
    $("story").hidden = false;
    go(0);
  }

  // Tap right = next, tap left = back, press and hold = pause
  for (const [id, dir] of [["tapPrev", -1], ["tapNext", 1]]) {
    const z = $(id);
    z.addEventListener("pointerdown", () => { heldAt = Date.now(); $("story").classList.add("paused"); });
    z.addEventListener("pointerup", () => $("story").classList.remove("paused"));
    z.addEventListener("pointerleave", () => $("story").classList.remove("paused"));
    z.addEventListener("click", () => { if (Date.now() - heldAt < 300) go(si + dir); });
  }
  $("storySkip").onclick = () => go(SLIDES.length - 1);

  function finishOnboarding() {
    store.set("unwrapped", true);
    setView("album");    // the last slide's button opens the album itself
    $("onboard").classList.add("leaving");
    document.body.style.overflow = "";
    setTimeout(() => ($("onboard").hidden = true), 600);
  }

  // ═════════════ LIBRARY / SETTINGS / SONG SHEET ═════════════
  function setView(v) {
    view = v;
    $("libView").hidden = v !== "library";
    $("albumView").hidden = v !== "album";
    const el = v === "album" ? $("albumView") : $("libView");
    el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter");
    $("topbar").classList.remove("show");
    scrollTo(0, 0);
  }
  $("libCover").src = A.cover;
  $("libTitle").textContent = A.title;
  $("libSub").textContent = `Album · ${A.artist}`;
  $("libAlbum").onclick = () => setView("album");
  $$(".lib-btn").forEach((b) => (b.onclick = () => setView("library")));

  // Jiaqi's profile
  const profile = W.to || "You";
  $("pfpBtn").textContent = $("pfpBig").textContent = profile.trim()[0].toUpperCase();
  $("pname").textContent = profile;
  $("psub").textContent = `Made for you by ${A.artist}`;
  $("dfoot").textContent = `${A.title} · v${A.version}`;
  renderLikedCount();

  const closeAll = () => {
    for (const id of ["drawer", "sheet"]) { $(id).classList.remove("open"); $(id).setAttribute("aria-hidden", "true"); }
    $("scrim").classList.remove("show");
  };
  const openPanel = (id) => { $(id).classList.add("open"); $(id).setAttribute("aria-hidden", "false"); $("scrim").classList.add("show"); };
  $("scrim").onclick = closeAll;
  $("pfpBtn").onclick = () => openPanel("drawer");
  $$(".settings-btn").forEach((b) => (b.onclick = () => openPanel("drawer")));
  $("replayGift").onclick = () => { closeAll(); showOnboarding(); };
  swipeable($("drawer"), { move() {}, end(dx) { if (dx < -60) closeAll(); } });   // swipe left to close

  let sheetFor = 0;
  function openSheet(i) {
    sheetFor = i;
    $("sheetCover").src = A.cover;
    $("sheetTitle").textContent = A.tracks[i].title;
    $("sheetArtist").textContent = A.artist;
    const on = !!liked[A.tracks[i].file];
    $("sLike").classList.toggle("on", on);
    $("sLikeText").textContent = on ? "Remove from Liked Songs" : "Like";
    openPanel("sheet");
  }
  $("sQueue").onclick = () => { closeAll(); addToQueue(sheetFor); };
  $("sLike").onclick = () => { closeAll(); toggleLike(sheetFor); };

  setView("library");
  if (!store.get("unwrapped", false) && A.welcome) showOnboarding();

  // ── Offline ──
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    // When a new version finishes downloading, reload once so new songs and
    // covers show right away (skipped while music is playing).
    const hadWorker = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (hadWorker && audio.paused && $("onboard").hidden) location.reload();
    });
    // Versioned URL + no HTTP cache, so a new version is always picked up
    navigator.serviceWorker.register("sw.js?v=" + A.version, { updateViaCache: "none" });
    // Turn the download icon green once every song is saved on the phone
    const checkSaved = async () => {
      try {
        const hits = await Promise.all(A.tracks.map((t) => caches.match(t.file, { ignoreSearch: true })));
        $("saved").classList.toggle("ok", hits.every(Boolean));
        const n = hits.filter(Boolean).length;
        $("dlStatus").textContent = n === N ? `All ${N} songs saved on this phone` : `${n} of ${N} songs saved`;
      } catch (e) {}
    };
    navigator.serviceWorker.ready.then(checkSaved);
    setTimeout(checkSaved, 3000);
  }
</script>
</body>
</html>
